<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="112" viewBox="0 0 180 112" role="img" aria-labelledby="title desc">
  <title id="title">ManuLOOP project mark</title>
  <desc id="desc">A build, verify, judge and fix quality loop with an evidence gate.</desc>
  <defs>
    <linearGradient id="loop-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09251f"/>
      <stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
    <linearGradient id="loop-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7f7c5"/>
      <stop offset=".5" stop-color="#35d07f"/>
      <stop offset="1" stop-color="#178b67"/>
    </linearGradient>
    <filter id="loop-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".44"/>
    </filter>
    <marker id="loop-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b7f7c5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="178" height="110" rx="18" fill="url(#loop-bg)" stroke="#42d88a" stroke-opacity=".72"/>
  <path d="M12 83h156" stroke="#42d88a" stroke-opacity=".2"/>
  <g filter="url(#loop-shadow)">
    <circle cx="51" cy="48" r="29" fill="#0a1a1d" stroke="#1e755a" stroke-width="5"/>
    <path d="M49 19a29 29 0 0 1 27 22" fill="none" stroke="url(#loop-ring)" stroke-width="5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>
    <path d="M74 55a29 29 0 0 1-28 22" fill="none" stroke="#f4c466" stroke-width="5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>
    <path d="M43 77a29 29 0 0 1-19-29" fill="none" stroke="#8bdcf2" stroke-width="5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>
    <circle cx="51" cy="48" r="15" fill="#123d35" stroke="#b7f7c5" stroke-width="1.3"/>
    <path d="m43 48 5 5 11-12" fill="none" stroke="#edfff1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="5.2" font-weight="700" text-anchor="middle">
    <circle cx="22" cy="31" r="8" fill="#123349" stroke="#8bdcf2"/><text x="22" y="33" fill="#dff9ff">SCAN</text>
    <circle cx="82" cy="29" r="8" fill="#243b28" stroke="#b7f7c5"/><text x="82" y="31" fill="#e9fff0">BUILD</text>
    <circle cx="83" cy="69" r="8" fill="#3d3020" stroke="#f4c466"/><text x="83" y="71" fill="#fff2c7">JUDGE</text>
  </g>
  <path d="M102 29h57M102 45h44M102 61h51" stroke="#75d79f" stroke-opacity=".52" stroke-linecap="round"/>
  <circle cx="104" cy="29" r="2.5" fill="#b7f7c5"/><circle cx="104" cy="45" r="2.5" fill="#f4c466"/><circle cx="104" cy="61" r="2.5" fill="#8bdcf2"/>
  <text x="102" y="78" fill="#ecfff1" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">MANULOOP</text>
  <text x="102" y="96" fill="#8bcaa6" font-family="Segoe UI,Arial,sans-serif" font-size="7.3" font-weight="600" letter-spacing=".4">EVIDENCE QUALITY GATE</text>
</svg>
