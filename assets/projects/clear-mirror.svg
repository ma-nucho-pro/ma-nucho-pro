    <rect x="16" y="18" width="70" height="58" rx="12" fill="#050b16" stroke="#8fc7ff" stroke-width="1.8"/>
    <path d="M51 20a33 33 0 0 1 0 54L29 47z" fill="url(#mirror-glass)" opacity=".95"/>
    <path d="M51 25a28 28 0 0 0 0 44" fill="none" stroke="#eff6ff" stroke-width="1.3" opacity=".9"/>
    <path d="M51 30v36M28 47h46" stroke="#bfdbfe" stroke-width="1.2" opacity=".9"/>
    <path d="M32 47c7-9 16-9 19 0-3 9-12 9-19 0Z" fill="#07152a" stroke="#f0f7ff" stroke-width="1.4"/>
    <circle cx="46" cy="47" r="3.1" fill="#60a5fa"/>
    <path d="m59 53 4 4 8-10" fill="none" stroke="#f0f7ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-linecap="round">
    <path d="M98 28h54M98 40h39M98 52h48" stroke-width="2" opacity=".62"/>
    <path d="M98 66h27" stroke-width="1.5" opacity=".46"/>
