<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="112" viewBox="0 0 180 112" role="img" aria-labelledby="title desc">
  <title id="title">Clear Mirror project mark</title>
  <desc id="desc">A blue reflective mirror and independent judge mark for evidence-based AI review.</desc>
  <defs>
    <linearGradient id="mirror-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f3d"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="mirror-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset=".42" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="mirror-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="178" height="110" rx="18" fill="url(#mirror-bg)" stroke="#60a5fa" stroke-opacity=".72"/>
  <path d="M12 83h156" stroke="#60a5fa" stroke-opacity=".2"/>
