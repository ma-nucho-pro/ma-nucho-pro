    <circle cx="20" cy="31" r="4" fill="#55c7ff"/><circle cx="82" cy="31" r="4" fill="#8b7bff"/>
    <path d="M94 34h57M94 48h46M94 62h51" stroke="#91dcff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <circle cx="98" cy="34" r="3.5" fill="#b7f3ff"/><circle cx="98" cy="48" r="3.5" fill="#55c7ff"/><circle cx="98" cy="62" r="3.5" fill="#8b7bff"/>
