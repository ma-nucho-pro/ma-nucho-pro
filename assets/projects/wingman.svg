<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="112" viewBox="0 0 180 112" role="img" aria-labelledby="title desc">
  <title id="title">Wingman project mark</title>
  <desc id="desc">Two connected wings and synchronized context nodes representing one AI context across tools and computers.</desc>
  <defs>
