  <rect x="1" y="1" width="178" height="110" rx="18" fill="url(#wing-bg)" stroke="#68d9ff" stroke-opacity=".72"/>
  <path d="M12 83h156" stroke="#68d9ff" stroke-opacity=".2"/>
