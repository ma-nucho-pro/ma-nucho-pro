      <stop offset="0" stop-color="#10273c"/>
      <stop offset="1" stop-color="#111323"/>
    </linearGradient>
    <linearGradient id="wing-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7f3ff"/>
      <stop offset=".52" stop-color="#55c7ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <filter id="wing-shadow" x="-30%" y="-30%" width="160%" height="170%">
