<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Roberto Manuel Jara Peche — AI agent systems</title>
  <desc id="desc">A dark blue banner showing three pillars: remember, create, and verify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fff"/>
      <stop offset="1" stop-color="#65a5ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#243457" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".28"/>
  <circle cx="1410" cy="120" r="260" fill="#1b3b78" opacity=".2"/>
  <circle cx="90" cy="820" r="260" fill="#12336e" opacity=".16"/>
  <path d="M80 210H1520" stroke="#254a93" stroke-width="2" opacity=".75"/>

  <g transform="translate(92 88)" filter="url(#glow)">
    <rect x="0" y="0" width="118" height="118" rx="30" fill="#08101f" stroke="#3686ff" stroke-width="5"/>
    <circle cx="59" cy="59" r="34" fill="none" stroke="#3686ff" stroke-width="5"/>
    <path d="M59 10V26M59 92V108M10 59H26M92 59H108" stroke="#66a5ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M51 47L78 37L68 81L56 61L39 53Z" fill="url(#blue)"/>
  </g>

  <text x="255" y="135" fill="#f4f7ff" font-family="Arial, Segoe UI, sans-serif" font-size="62" font-weight="700" letter-spacing="4">AI AGENT SYSTEMS</text>
  <text x="258" y="184" fill="#76adff" font-family="Arial, Segoe UI, sans-serif" font-size="26" letter-spacing="7">ROBERTO MANUEL JARA PECHE</text>
  <text x="800" y="292" text-anchor="middle" fill="#e7edf9" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="600">Building useful systems for real work.</text>

  <g transform="translate(85 370)">
    <rect width="430" height="270" rx="24" fill="#0d1629" stroke="#3987ff" stroke-width="3"/>
    <text x="42" y="66" fill="#64a6ff" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="3">01</text>
    <text x="42" y="130" fill="#f5f7ff" font-family="Arial, Segoe UI, sans-serif" font-size="44" font-weight="700">REMEMBER</text>
    <path d="M42 158H388" stroke="#2a477c" stroke-width="2"/>
    <text x="42" y="204" fill="#b8c6df" font-family="Arial, Segoe UI, sans-serif" font-size="24">Context, memory, constraints</text>
    <text x="42" y="238" fill="#7fa9e6" font-family="Arial, Segoe UI, sans-serif" font-size="20">local-first and auditable</text>
  </g>

  <g transform="translate(585 370)">
    <rect width="430" height="270" rx="24" fill="#0d1629" stroke="#3987ff" stroke-width="3"/>
    <text x="42" y="66" fill="#64a6ff" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="3">02</text>
    <text x="42" y="130" fill="#f5f7ff" font-family="Arial, Segoe UI, sans-serif" font-size="44" font-weight="700">CREATE</text>
    <path d="M42 158H388" stroke="#2a477c" stroke-width="2"/>
    <text x="42" y="204" fill="#b8c6df" font-family="Arial, Segoe UI, sans-serif" font-size="24">Intent, tools, useful output</text>
    <text x="42" y="238" fill="#7fa9e6" font-family="Arial, Segoe UI, sans-serif" font-size="20">skills that ship across harnesses</text>
  </g>

  <g transform="translate(1085 370)">
    <rect width="430" height="270" rx="24" fill="#0d1629" stroke="#3987ff" stroke-width="3"/>
    <text x="42" y="66" fill="#64a6ff" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="3">03</text>
    <text x="42" y="130" fill="#f5f7ff" font-family="Arial, Segoe UI, sans-serif" font-size="44" font-weight="700">VERIFY</text>
    <path d="M42 158H388" stroke="#2a477c" stroke-width="2"/>
    <text x="42" y="204" fill="#b8c6df" font-family="Arial, Segoe UI, sans-serif" font-size="24">Evidence, risks, next step</text>
    <text x="42" y="238" fill="#7fa9e6" font-family="Arial, Segoe UI, sans-serif" font-size="20">honest about uncertainty</text>
  </g>

  <path d="M80 735H1520" stroke="#254a93" stroke-width="2" opacity=".75"/>
  <text x="800" y="805" text-anchor="middle" fill="#9fb1d0" font-family="Arial, Segoe UI, sans-serif" font-size="28" letter-spacing="4">OPEN SOURCE | PRACTICAL AI | CLEAR THINKING</text>
</svg>
