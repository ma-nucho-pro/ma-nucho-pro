name: Refresh code-generated profile visuals

on:
  push:
    branches:
      - main
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USER_NAME: ma-nucho-pro
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate local SVG visuals
        run: node scripts/generate-profile-visuals.mjs

      - name: Commit updated visuals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github assets/projects
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
            exit 0
          fi
          git commit -m "Refresh code-generated profile visuals"
          git push
